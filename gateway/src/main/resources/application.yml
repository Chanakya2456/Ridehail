server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 30
            key-resolver: "#{@principalOrAddressKeyResolver}"
      routes:
        - id: location
          uri: ${LOCATION_URL:http://localhost:8082}
          predicates: [Path=/drivers/*/location]
        - id: trips
          uri: ${TRIP_URL:http://localhost:8081}
          predicates: [Path=/trips/**]
        - id: driver-ws
          uri: ${DRIVER_WS_URL:ws://localhost:8083}
          predicates: [Path=/ws/drivers/**]
        - id: drivers
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers/**]
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
