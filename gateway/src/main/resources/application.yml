server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: location
          uri: ${LOCATION_URL:http://localhost:8082}
          predicates: [Path=/drivers/*/location, Method=POST]
        - id: trip-create
          uri: ${TRIP_URL:http://localhost:8081}
          predicates: [Path=/trips, Method=POST]
        - id: trips
          uri: ${TRIP_URL:http://localhost:8081}
          predicates: [Path=/trips/**]
        - id: driver-register
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers, Method=POST]
        - id: driver-offer-poll
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers/*/offer, Method=GET]
        - id: driver-offer-accept
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers/*/offers/*/accept, Method=POST]
        - id: driver-offer-reject
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers/*/offers/*/reject, Method=POST]
        - id: driver-ws
          uri: ${DRIVER_WS_URL:ws://localhost:8083}
          predicates: [Path=/ws/drivers/**]
        - id: drivers
          uri: ${DRIVER_URL:http://localhost:8083}
          predicates: [Path=/drivers/**]
ridehail:
  rate-limit:
    caller:
      replenish-rate: ${RATE_LIMIT_CALLER_RPS:10}
      burst-capacity: ${RATE_LIMIT_CALLER_BURST:30}
    address:
      replenish-rate: ${RATE_LIMIT_IP_RPS:100}
      burst-capacity: ${RATE_LIMIT_IP_BURST:300}
    routes:
      location:
        caller:
          replenish-rate: ${RATE_LIMIT_LOCATION_RPS:2}
          burst-capacity: ${RATE_LIMIT_LOCATION_BURST:5}
        address:
          replenish-rate: ${RATE_LIMIT_LOCATION_IP_RPS:30}
          burst-capacity: ${RATE_LIMIT_LOCATION_IP_BURST:60}
      trip-create:
        caller:
          replenish-rate: ${RATE_LIMIT_TRIP_CREATE_RPS:1}
          burst-capacity: ${RATE_LIMIT_TRIP_CREATE_BURST:3}
        address:
          replenish-rate: ${RATE_LIMIT_TRIP_CREATE_IP_RPS:20}
          burst-capacity: ${RATE_LIMIT_TRIP_CREATE_IP_BURST:40}
      driver-register:
        address:
          replenish-rate: ${RATE_LIMIT_REGISTER_RPS:1}
          burst-capacity: ${RATE_LIMIT_REGISTER_BURST:3}
      driver-offer-poll:
        caller:
          replenish-rate: ${RATE_LIMIT_OFFER_POLL_RPS:2}
          burst-capacity: ${RATE_LIMIT_OFFER_POLL_BURST:5}
      driver-offer-accept:
        caller:
          replenish-rate: ${RATE_LIMIT_OFFER_RESPONSE_RPS:1}
          burst-capacity: ${RATE_LIMIT_OFFER_RESPONSE_BURST:3}
      driver-offer-reject:
        caller:
          replenish-rate: ${RATE_LIMIT_OFFER_RESPONSE_RPS:1}
          burst-capacity: ${RATE_LIMIT_OFFER_RESPONSE_BURST:3}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
