apiVersion: v1
kind: ConfigMap
metadata: {name: ridehail-config}
data:
  SPRING_PROFILES_ACTIVE: prod
  JWT_ISSUER_URI: https://identity.example.invalid/
  JWT_AUDIENCE: ridehail-api
  KAFKA_SECURITY_PROTOCOL: SSL
  POSTGRES_SSL_MODE: verify-full
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_DATA_REDIS_HOST: redis-master
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ridehail
  TRIP_URL: http://trip-service
  LOCATION_URL: http://location-service
  DRIVER_URL: http://driver-service
  DRIVER_WS_URL: ws://driver-service
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, labels: {app: gateway}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: ridehail/gateway:1.0.0
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: ridehail-config}
            - secretRef: {name: ridehail-secret}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 20, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 40, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trip-service, labels: {app: trip-service}}
spec:
  replicas: 3
  selector: {matchLabels: {app: trip-service}}
  template:
    metadata: {labels: {app: trip-service}}
    spec:
      containers:
        - name: trip-service
          image: ridehail/trip-service:1.0.0
          ports: [{containerPort: 8081}]
          envFrom:
            - configMapRef: {name: ridehail-config}
            - secretRef: {name: ridehail-secret}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, initialDelaySeconds: 20, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8081}, initialDelaySeconds: 40, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: trip-service}
spec:
  selector: {app: trip-service}
  ports: [{port: 80, targetPort: 8081}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: trip-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trip-service}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: location-service, labels: {app: location-service}}
spec:
  replicas: 3
  selector: {matchLabels: {app: location-service}}
