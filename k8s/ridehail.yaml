          livenessProbe:  {httpGet: {path: /actuator/health/liveness, port: 8082}, initialDelaySeconds: 40, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
