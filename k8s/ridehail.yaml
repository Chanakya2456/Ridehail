---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ridehail}
spec:
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gateway, port: {number: 80}}}}
